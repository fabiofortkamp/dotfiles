$character"""
# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
# The 'success_symbol' segment is being set to '➜' with the color 'bold green'
success_symbol = '[➜ ](bold green)'
error_symbol = '[➜ ](bold red)'


[c]
symbol = " "

[directory]
read_only = " 󰌾"
truncation_length = 6
truncation_symbol = "..."
truncate_to_repo = false


[docker_context]
disabled = true

[shell]
disabled = false
nu_indicator = "🌑"
zsh_indicator = "🐚"
bash_indicator = "🦪"
fish_indicator = "🐟"

# stolen from https://github.com/jj-vcs/jj/wiki/Starship
# custom module for jj status
[custom.jj]
ignore_timeout = true
description = "The current jj status"
detect_folders = [".jj"]
symbol = "🥋 "
command = '''
jj log --revisions @ --no-graph --ignore-working-copy --color always --limit 1 --template '
  separate(" ",
    change_id.shortest(4),
    bookmarks,
    "|",
    concat(
      if(conflict, "💥"),
      if(divergent, "🚧"),
      if(hidden, "👻"),
      if(immutable, "🔒"),
    ),
    raw_escape_sequence("\x1b[1;32m") ++ if(empty, "(empty)"),
    raw_escape_sequence("\x1b[1;32m") ++ coalesce(
      truncate_end(29, description.first_line(), "…"),
      "(no description set)",
    ) ++ raw_escape_sequence("\x1b[0m"),
  )
'
'''

# optionally disable git modules
[git_state]
disabled = true

[git_commit]
disabled = true

[git_metrics]
disabled = true

[git_branch]
disabled = true

# re-enable git_branch as long as we're not in a jj repo
[custom.git_branch]
when = true
command = "jj root >/dev/null 2>&1 || starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"
