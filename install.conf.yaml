- defaults:
    link:
      create: true
      relink: true
      backup: true
      relative: true

# Broken symlinks left over from the Stow layout (~/.config/mise ->
# ../dotfiles/mise/.config/mise) block `link`: dotbot follows symlinks when
# checking whether a parent directory exists, so a dangling one looks absent
# and the subsequent mkdir fails on it. Stow folded package roots one level
# inside each of these directories, hence the explicit list rather than
# `recursive: true`. Quote "~" -- a bare ~ is null in YAML.
- clean:
    - "~"
    - ~/.config
    - ~/Library/Application Support/Code/User
    - ~/Library/Application Support/Cursor/User
    - ~/Library/Application Support/Positron/User

- create:
    - ~/.local/bin
    - ~/.local/lib
    - ~/build

- brewfile:
    - Brewfile

- link:
    ~/.config/fish: fish
    ~/.config/nvim: nvim
    ~/.config/ghostty: ghostty
    ~/.config/git: git
    ~/.config/gh: gh
    ~/.config/karabiner: karabiner
    ~/.config/herdr: herdr
    ~/.julia/config: julia
    ~/.config/tmux/tmux.conf: tmux.conf
    ~/.config/mise/config.toml: mise-config.toml
    ~/.config/starship.toml: starship.toml
    ~/.config/lazygit/config.yml: lazygit.yml
    ~/.config/mypy/config: mypy-config.ini
    ~/.config/ruff/ruff.toml: ruff-config.toml
    ~/.config/wezterm/wezterm.lua: wezterm.lua
    ~/.config/atuin/config.toml: atuin.toml
    ~/.config/jj/config.toml: jj.toml
    ~/.config/hatch/config.toml: hatch/config.toml
    ~/.hatch-complete.zsh: hatch/.hatch-complete.zsh
    ~/.clang-format: clang/.clang-format
    ~/.clang-tidy: clang/.clang-tidy
    ~/.default-gems: default-gems
    ~/.default-npm-packages: default-npm-packages
    ~/.default-python-packages: default-python-packages
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/snippets: vscode/snippets
    ~/Library/Application Support/Cursor/User/settings.json: cursor/settings.json
    ~/Library/Application Support/Positron/User/settings.json: positron/settings.json

- shell:
    - command: ./build_neovim.sh
      description: Building Neovim from source
      stdin: true
      stdout: true
      stderr: true

    - command: mise plugins update
      description: Updating mise plugins (a stale cached plugin can carry a bug already fixed upstream)
      stdout: true
      stderr: true

    - command: CPATH="$(brew --prefix)/include" LIBRARY_PATH="$(brew --prefix)/lib" mise install
      description: Installing mise-managed tool versions (CPATH/LIBRARY_PATH so lua's native build finds Homebrew's readline)
      stdout: true
      stderr: true

    - command: go install golang.org/x/tools/gopls@latest
      description: Installing gopls
      stdout: true
      stderr: true

    - command: ./set-default-shell.sh
      description: Setting fish as the default shell
      stdin: true
      stdout: true
      stderr: true

    - command: mise exec julia -- julia --project=~/.julia/environments/nvim-lspconfig -e 'using Pkg; Pkg.add("LanguageServer"); Pkg.add("SymbolServer"); Pkg.add("StaticLint")'
      description: Installing the Julia language server
      stdout: true
      stderr: true
